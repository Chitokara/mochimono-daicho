<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-title" content="持ち物台帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>持ち物台帳</title>
<style>
:root{--bg:#eef1ec;--sf:#fbfcfa;--ink:#1f2a2e;--mute:#5f6e70;--line:#d5dcd5;--ac:#2f6f5e;--acink:#fff;--warn:#b3402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151c1d;--sf:#1e2829;--ink:#e6ece8;--mute:#93a3a2;--line:#2f3d3e;--ac:#59b399;--acink:#10201b;--warn:#e07a68;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151c1d;--sf:#1e2829;--ink:#e6ece8;--mute:#93a3a2;--line:#2f3d3e;--ac:#59b399;--acink:#10201b;--warn:#e07a68;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:.04em}
.sum{color:var(--mute);font-size:14px;margin:0 0 14px}
.sum b{color:var(--ink);font-weight:700}
.tools{display:flex;gap:8px;margin-bottom:10px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.tools select{width:auto;flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.item{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-left:5px solid var(--ac);border-radius:6px 14px 14px 6px;padding:12px 14px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer}
.item .t{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.item .p{font-weight:400;color:var(--mute);white-space:nowrap}
.item .m{color:var(--mute);font-size:13px;margin-top:2px}
.item .a{font-size:13px;margin-top:6px}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:12px;margin-right:6px}
.th{float:left;width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);margin-right:12px}
.bd{overflow:hidden}
.ph{display:flex;gap:12px;align-items:center}
#f-img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.phb{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.phb .sub{font-size:14px;margin:0;display:inline-block;color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--acink);border:0;border-radius:999px;padding:14px 22px;font:inherit;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
dialog{border:0;padding:0;background:transparent;width:100%;max-width:640px;margin:auto auto 0;max-height:92vh;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:20px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.row{display:flex;gap:10px}.row>div{flex:1}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button,.sub{font:inherit;border-radius:10px;padding:11px 14px;border:1px solid var(--line);background:var(--sf);color:var(--ink);cursor:pointer}
.btns .ok{flex:1;background:var(--ac);color:var(--acink);border-color:var(--ac);font-weight:700}
.btns .del{color:var(--warn)}
.foot{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.foot .sub{font-size:13px;padding:8px 12px}
.msg{font-size:12px;color:var(--mute);margin-top:8px}
</style>
</head>
<body>
<main>
  <h1>持ち物台帳</h1>
  <p class="sum" id="sum"></p>
  <div class="tools">
    <input id="q" type="search" placeholder="名前・場所・メモで検索" aria-label="検索">
    <select id="sort" aria-label="並び替え">
      <option value="new">購入日が新しい順</option>
      <option value="old">購入日が古い順</option>
      <option value="name">名前順</option>
      <option value="price">価格が高い順</option>
    </select>
  </div>
  <div class="chips" id="chips" role="group" aria-label="分類"></div>
  <div id="list"></div>
  <div class="foot">
    <button class="sub" id="exp">バックアップを書き出す</button>
    <button class="sub" id="imp">読み込む</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
  <p class="msg" id="msg">データはこの端末のブラウザ内に保存されます。</p>
</main>
<button class="fab" id="add">＋ 物品を登録</button>

<dialog id="dlg">
  <div class="sheet">
    <h2 id="dt">物品を登録</h2>
    <label for="f-name">名前</label>
    <input id="f-name" placeholder="例:電気ケトル">
    <div class="row">
      <div><label for="f-cat">分類</label><select id="f-cat"></select></div>
      <div><label for="f-date">購入日</label><input id="f-date" type="date"></div>
    </div>
    <div class="row">
      <div><label for="f-price">価格(円)</label><input id="f-price" type="number" inputmode="numeric" min="0" placeholder="0"></div>
      <div><label for="f-qty">数量</label><input id="f-qty" type="number" inputmode="numeric" min="1" value="1"></div>
    </div>
    <label for="f-place">置き場所</label>
    <input id="f-place" placeholder="例:キッチン 上の棚">
    <label for="f-note">メモ</label>
    <textarea id="f-note" rows="3" placeholder="型番、保証期限など"></textarea>
    <label>写真</label>
    <div class="ph">
      <img id="f-img" alt="" hidden>
      <div class="phb">
        <label class="sub" for="f-file">写真を選ぶ・撮る</label>
        <button class="sub" id="f-rm" type="button" hidden>写真を外す</button>
      </div>
      <input id="f-file" type="file" accept="image/*" hidden>
    </div>
    <div class="btns">
      <button class="del" id="del" type="button">削除</button>
      <button id="cancel" type="button">閉じる</button>
      <button class="ok" id="save" type="button">保存</button>
    </div>
    <p class="msg" id="err" style="color:var(--warn)"></p>
  </div>
</dialog>

<dialog id="bk">
  <div class="sheet">
    <h2 id="bt"></h2>
    <p class="msg" id="bh"></p>
    <textarea id="bx" rows="8" aria-label="バックアップ"></textarea>
    <div class="btns">
      <button id="bc" type="button">閉じる</button>
      <button class="ok" id="bcopy" type="button">コピー</button>
      <button class="ok" id="bgo" type="button">読み込む</button>
    </div>
    <p class="msg" id="bm"></p>
  </div>
</dialog>

<script>
(function(){
var CATS=["家電","家具・インテリア","衣類・靴","日用品","キッチン用品","本・メディア","文房具","工具・DIY","趣味・スポーツ","その他"];
var KEY="mono-ichiran-v1";
var items=[],cat="すべて",editId=null,photo="";
function load(){try{var r=localStorage.getItem(KEY);if(r)items=JSON.parse(r)||[]}catch(e){items=[]}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){say("保存できませんでした。写真が多すぎる可能性があります。不要な写真を外してください。")}}
var $=function(i){return document.getElementById(i)};
function say(t){$("msg").textContent=t}
function yen(n){return "¥"+Number(n||0).toLocaleString("ja-JP")}
function elapsed(d){
  if(!d)return"";var a=new Date(d),n=new Date();
  var m=(n.getFullYear()-a.getFullYear())*12+n.getMonth()-a.getMonth();
  if(n.getDate()<a.getDate())m--;
  if(m<0)return"購入予定";if(m<1)return"購入から1か月未満";
  var y=Math.floor(m/12),r=m%12;
  return"購入から"+(y?y+"年":"")+(r?r+"か月":"");
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function renderChips(){
  var all=["すべて"].concat(CATS);
  $("chips").innerHTML=all.map(function(c){
    var n=c==="すべて"?items.length:items.filter(function(i){return i.cat===c}).length;
    return'<button class="chip" aria-pressed="'+(c===cat)+'" data-c="'+esc(c)+'">'+esc(c)+" "+n+"</button>";
  }).join("");
}
function render(){
  var q=$("q").value.trim().toLowerCase(),s=$("sort").value;
  var list=items.filter(function(i){
    if(cat!=="すべて"&&i.cat!==cat)return false;
    return !q||[i.name,i.place,i.note,i.cat].join(" ").toLowerCase().indexOf(q)>-1;
  });
  list.sort(function(a,b){
    if(s==="name")return a.name.localeCompare(b.name,"ja");
    if(s==="price")return (b.price||0)*(b.qty||1)-(a.price||0)*(a.qty||1);
    var x=a.date||"",y=b.date||"";
    return s==="old"?(x||"9").localeCompare(y||"9"):y.localeCompare(x);
  });
  var cnt=items.reduce(function(t,i){return t+(i.qty||1)},0);
  var tot=items.reduce(function(t,i){return t+(i.price||0)*(i.qty||1)},0);
  $("sum").innerHTML="登録 <b>"+items.length+"</b> 件(計 "+cnt+" 点)/購入額の合計 <b>"+yen(tot)+"</b>";
  renderChips();
  if(!list.length){
    $("list").innerHTML='<div class="empty">'+(items.length?"条件に合う物品がありません。":"まだ何も登録されていません。<br>右下の「物品を登録」から追加しましょう。")+"</div>";
    return;
  }
  $("list").innerHTML=list.map(function(i){
    var q2=i.qty>1?" ×"+i.qty:"";
    return'<button class="item" data-id="'+i.id+'">'+(i.photo?'<img class="th" alt="" src="'+esc(i.photo)+'">':"")+'<div class="bd"><div class="t"><span>'+esc(i.name)+q2+'</span><span class="p">'+(i.price?yen(i.price):"")+'</span></div>'
    +'<div class="m"><span class="tag">'+esc(i.cat)+"</span>"+(i.place?esc(i.place):"")+"</div>"
    +'<div class="a">'+(i.date?esc(i.date.replace(/-/g,"/"))+"購入 ・ "+elapsed(i.date):"購入日 未設定")+"</div>"
    +(i.note?'<div class="m">'+esc(i.note)+"</div>":"")+"</div></button>";
  }).join("");
}
function openForm(id){
  editId=id||null;$("err").textContent="";
  var it=items.filter(function(i){return i.id===id})[0]||{};
  $("dt").textContent=it.id?"物品を編集":"物品を登録";
  $("f-name").value=it.name||"";
  $("f-cat").value=it.cat||(cat!=="すべて"?cat:CATS[0]);
  $("f-date").value=it.date||new Date().toISOString().slice(0,10);
  $("f-price").value=it.price||"";
  $("f-qty").value=it.qty||1;
  $("f-place").value=it.place||"";
  $("f-note").value=it.note||"";
  photo=it.photo||"";showPh();
  $("del").style.display=it.id?"":"none";delArm=false;$("del").textContent="削除";
  $("dlg").showModal();
}
function showPh(){var im=$("f-img");im.hidden=!photo;if(photo)im.src=photo;$("f-rm").hidden=!photo}
$("f-file").onchange=function(){
  var f=this.files&&this.files[0];this.value="";if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var im=new Image();
    im.onload=function(){
      var r=Math.min(1,480/Math.max(im.width,im.height)),w=Math.round(im.width*r),h=Math.round(im.height*r);
      var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);
      photo=c.toDataURL("image/jpeg",0.7);showPh();$("err").textContent="";
    };
    im.onerror=function(){$("err").textContent="この写真は読み込めませんでした。"};
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
};
$("f-rm").onclick=function(){photo="";showPh()};
function save(){
  var name=$("f-name").value.trim();
  if(!name){$("err").textContent="名前を入力してください。";return}
  var o={name:name,cat:$("f-cat").value,date:$("f-date").value,price:Math.max(0,parseInt($("f-price").value,10)||0),
    qty:Math.max(1,parseInt($("f-qty").value,10)||1),place:$("f-place").value.trim(),note:$("f-note").value.trim(),photo:photo};
  if(editId){items=items.map(function(i){return i.id===editId?Object.assign({},i,o):i})}
  else{o.id="i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);items.push(o)}
  persist();$("dlg").close();render();
}
$("f-cat").innerHTML=CATS.map(function(c){return"<option>"+c+"</option>"}).join("");
$("add").onclick=function(){openForm()};
$("cancel").onclick=function(){$("dlg").close()};
$("save").onclick=save;
var delArm=false;
$("del").onclick=function(){
  if(!editId)return;
  if(!delArm){delArm=true;$("del").textContent="もう一度タップで削除";$("err").textContent="削除をやめる場合は「閉じる」を押してください。";return}
  items=items.filter(function(i){return i.id!==editId});persist();delArm=false;$("dlg").close();render();
};
$("list").onclick=function(e){var b=e.target.closest(".item");if(b)openForm(b.dataset.id)};
$("chips").onclick=function(e){var b=e.target.closest(".chip");if(b){cat=b.dataset.c;render()}};
$("q").oninput=render;$("sort").onchange=render;
function openBk(mode){
  $("bm").textContent="";
  $("bt").textContent=mode==="exp"?"バックアップを書き出す":"バックアップを読み込む";
  $("bh").textContent=mode==="exp"?"下の文字列をすべてコピーして、メモなどに保管してください。写真はバックアップに含まれません。":"書き出した文字列をすべて貼り付けて「読み込む」を押してください。現在のデータは置き換わります。";
  $("bx").value=mode==="exp"?JSON.stringify(items.map(function(i){var o=Object.assign({},i);delete o.photo;return o})):"";
  $("bx").readOnly=mode==="exp";
  $("bcopy").style.display=mode==="exp"?"":"none";
  $("bgo").style.display=mode==="exp"?"none":"";
  $("bk").showModal();
}
$("exp").onclick=function(){openBk("exp")};
$("imp").onclick=function(){openBk("imp")};
$("bc").onclick=function(){$("bk").close()};
$("bcopy").onclick=function(){
  var x=$("bx");x.focus();x.select();x.setSelectionRange(0,x.value.length);
  var ok=false;try{ok=document.execCommand("copy")}catch(e){}
  $("bm").textContent=ok?"コピーしました。":"自動でコピーできませんでした。選択された文字列を長押ししてコピーしてください。";
};
$("bgo").onclick=function(){
  try{
    var a=JSON.parse($("bx").value.trim());if(!Array.isArray(a))throw 0;
    var old={};items.forEach(function(x){if(x.photo)old[x.id]=x.photo});
    items=a.filter(function(i){return i&&typeof i.name==="string"}).map(function(i,n){i.id=i.id||"i"+Date.now().toString(36)+n;if(!i.photo&&old[i.id])i.photo=old[i.id];if(i.photo&&String(i.photo).indexOf("data:image/")!==0)delete i.photo;return i});
    persist();render();$("bk").close();say(items.length+" 件を読み込みました。");
  }catch(e){$("bm").textContent="読み込めませんでした。書き出した内容をそのまま貼り付けてください。"}
};
load();render();
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}
</script>
</body>
</html>
